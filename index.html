<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f3ee">
    <meta name="description" content="A simple RSS reader that works offline.">
    <title>Little RSS Reader</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="icon-button header-back-button" id="back-button" type="button" aria-label="Back to stories" title="Back to stories" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h11"/></svg>
        </button>
        <button class="icon-button menu-toggle" id="menu-toggle" type="button" aria-label="Open feed menu" aria-expanded="false" aria-controls="feed-sidebar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="story-filter-control">
          <label class="sr-only" for="story-filter">Filter stories by read status</label>
          <select id="story-filter" class="story-filter-select">
            <option value="unread">Unread</option>
            <option value="all">All</option>
            <option value="read">Read</option>
          </select>
          <span id="unread-count" class="unread-count" aria-label="Unread stories">0</span>
        </div>
        <div class="header-actions">
          <button class="icon-button mark-all-read" id="mark-all-read" type="button" aria-label="Mark all unread stories in this view as read" title="Mark all unread stories in this view as read" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10M4 6l1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17"/></svg>
          </button>
          <button class="icon-button data-action" id="refresh-button" type="button" aria-label="Refresh feeds" title="Refresh feeds">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18 6l2 2M4 16l2 2a7 7 0 0 0 12.4-3"/></svg>
          </button>
          <button class="icon-button add-toggle" id="add-toggle" type="button" aria-label="Add a feed" aria-haspopup="dialog" aria-controls="add-feed-dialog" title="Add a feed">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </header>
      <div id="pull-refresh-indicator" class="pull-refresh-indicator" role="status" aria-live="polite" aria-hidden="true">
        <span class="pull-refresh-icon" aria-hidden="true">↓</span>
        <span id="pull-refresh-label">Pull to refresh</span>
      </div>

      <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
      <aside id="feed-sidebar" class="feed-sidebar" aria-label="Feed navigation" aria-hidden="true" inert>
        <div class="sidebar-heading">
          <span>Library</span>
          <button id="close-sidebar" class="dialog-close" type="button" aria-label="Close menu">×</button>
        </div>
        <nav id="feed-navigation" class="feed-navigation" aria-label="Choose stories">
          <button class="nav-item all-feeds-item" type="button" data-feed-url="">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5zM8 8h8M8 12h8M8 16h5"/></svg>
            <span>All stories</span>
          </button>
          <button id="bookmarks-button" class="nav-item bookmarks-item" type="button" aria-current="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg>
            <span>Bookmarks</span>
          </button>
          <button id="settings-button" class="nav-item settings-item" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.5.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.5-.9l-1.7.7-1.4-2.4 1.4-1.1a8 8 0 0 1 0-1.8l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.5-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.5.9l1.7-.7 1.4 2.4-1.4 1.1a8 8 0 0 1 0 1.8Z" transform="translate(-1 -2)"/></svg>
            <span>Settings</span>
          </button>
          <div class="sidebar-section-heading">
            <span class="sidebar-section-label">Feeds</span>
            <button id="add-folder-button" class="sidebar-add-folder" type="button" aria-label="Create a folder" title="Create a folder">+</button>
          </div>
          <form id="add-folder-form" class="sidebar-add-folder-form" hidden>
            <label class="sr-only" for="new-folder-name">Folder name</label>
            <input id="new-folder-name" type="text" maxlength="40" placeholder="Folder name" required>
            <button type="submit">Add</button>
            <button id="cancel-add-folder" type="button" aria-label="Cancel">×</button>
          </form>
          <p id="folder-create-status" class="sidebar-folder-status" role="status" aria-live="polite"></p>
          <div id="sidebar-feed-list" class="sidebar-feed-list"></div>
        </nav>
      </aside>

      <main>
        <dialog id="add-feed-dialog" class="add-dialog" aria-labelledby="add-dialog-title">
          <div class="dialog-heading">
            <h2 id="add-dialog-title">Add a feed</h2>
            <button id="close-dialog" class="dialog-close" type="button" aria-label="Close">×</button>
          </div>
          <div id="dialog-status" class="status" role="status" aria-live="polite"></div>
          <form id="add-feed-form" class="add-form">
            <label class="sr-only" for="feed-url">Feed URL or JSON</label>
            <textarea id="feed-url" name="url" rows="2" placeholder="Website, channel, or feed URL, or paste JSON" autocomplete="url" required></textarea>
            <button class="icon-button submit-feed" type="submit" aria-label="Add feed" title="Add feed">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </form>
          <div class="opml-actions" aria-label="Subscription import and export">
            <button id="import-button" class="settings-action-button" type="button">Import OPML</button>
            <button id="export-button" class="settings-action-button" type="button">Export OPML</button>
          </div>
          <progress id="import-progress" class="import-progress" max="100" value="0" aria-label="OPML import progress" hidden></progress>
          <input id="import-file" type="file" accept=".opml,.xml,text/xml,application/xml" hidden>
        </dialog>

        <dialog id="image-dialog" class="image-dialog" aria-label="Image preview">
          <button id="close-image-dialog" class="dialog-close image-dialog-close" type="button" aria-label="Close image">×</button>
          <img id="zoomed-image" alt="">
        </dialog>

        <section id="reader-view" class="reader-view" aria-labelledby="reader-title" hidden>
          <div class="reader-actions">
            <a id="reader-open-link" class="reader-open-link" href="#" target="_blank" rel="noopener noreferrer" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M18 13v5a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg>
              <span>Open in browser</span>
            </a>
            <button id="reader-bookmark-toggle" class="bookmark-toggle reader-bookmark-toggle" type="button" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg>
              <span>Bookmark</span>
            </button>
          </div>
          <article>
            <div id="reader-meta" class="story-meta"></div>
            <h2 id="reader-title" class="reader-title"></h2>
            <div id="reader-status" class="status" role="status" aria-live="polite"></div>
            <div id="reader-content" class="reader-content"></div>
          </article>
        </section>

        <section id="settings-view" class="settings-view" aria-labelledby="settings-title" hidden>
          <h1 id="settings-title" class="settings-page-title">Settings</h1>
          <div id="settings-status" class="status" role="status" aria-live="polite"></div>
          <section class="settings-card" aria-labelledby="appearance-settings-title">
            <h2 id="appearance-settings-title">Appearance</h2>
            <p class="settings-help">Choose how the reader looks on this device.</p>
            <button id="theme-toggle" class="settings-theme-toggle" type="button" aria-label="Switch to dark mode">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.3A8.5 8.5 0 0 1 8.7 3.8 8.5 8.5 0 1 0 20.2 15.3Z"/></svg>
              <span>Dark mode</span>
            </button>
          </section>
          <section class="settings-card" aria-labelledby="reading-settings-title">
            <h2 id="reading-settings-title">Reading</h2>
            <label class="settings-label" for="retention-months">Keep read stories for</label>
            <select id="retention-months" class="settings-select">
              <option value="1">1 month</option>
              <option value="3">3 months</option>
              <option value="6">6 months</option>
              <option value="12">12 months</option>
              <option value="all">Keep all</option>
            </select>
            <p class="settings-help">Older read stories can be removed when you refresh. Unread and bookmarked stories are always kept.</p>
            <p id="retention-preview" class="settings-preview" aria-live="polite"></p>
            <button id="save-settings" class="settings-save" type="button">Save setting</button>
          </section>
        </section>

        <section id="stories-view" class="stories-section" aria-label="Stories">
          <div class="stories-toolbar">
            <div id="status" class="status" role="status" aria-live="polite"></div>
          </div>
          <div id="story-list" class="story-list"></div>
          <button id="load-more-stories" class="load-more-stories" type="button" hidden>Load more stories</button>
          <div id="empty-state" class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 19a1 1 0 1 0 0-2 1 1 0 0 0 0 2ZM4 11a9 9 0 0 1 9 9M4 5a15 15 0 0 1 15 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <p>No stories yet.</p>
          </div>
        </section>
      </main>

    </div>
    <button id="back-to-top" class="icon-button back-to-top" type="button" aria-label="Back to top" title="Back to top" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7M12 5v14"/></svg>
    </button>
    <script src="./app.js" defer></script>
  </body>
</html>
